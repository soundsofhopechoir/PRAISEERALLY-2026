<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praise Rally - Third Edition</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d4a46;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      color: #1a1a1a;
      max-width: 450px;
      width: 100%;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }
    .subtitle {
      color: #0d4a46;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    h1 {
      color: #d35400;
      font-size: 2rem;
      margin: 10px 0;
    }
    .theme-box {
      background-color: #f39c12;
      color: #ffffff;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin: 15px 0;
    }
    .details {
      text-align: left;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      margin: 10px 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .btn-whatsapp {
      background-color: #25d366;
      color: white;
    }
    .btn-calendar {
      background-color: #4285f4;
      color: white;
    }
    .contact {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="subtitle">MARTYRS CHURCH NATEETE YOUTH MINISTRY</div>
    <p style="margin:0; font-size: 0.8rem; color: #666;">PRESENTS</p>
    <h1>Praise Rally</h1>
    <p style="margin-top:-10px; font-weight:bold; color:#777;">THIRD EDITION</p>

    <div class="theme-box">
      THEME: THE CORNERSTONE<br>
      <small style="font-weight: normal; font-size: 0.85rem;">EPHESIANS 2:20</small>
    </div>

    <div class="details">
      📅 <strong>Date:</strong> 25th October 2026<br>
      ⏰ <strong>Time:</strong> 2:00 PM<br>
      📍 <strong>Venue:</strong> Martyrs Church Nateete
    </div>

    <a class="btn btn-whatsapp" href="https://wa.me/256784474159?text=Hello!%20I%20would%20like%20to%20attend%20the%20Praise%20Rally.">
      📲 Tap to RSVP on WhatsApp
    </a>

    <a class="btn btn-calendar" href="https://www.google.com/calendar/render?action=TEMPLATE&text=Praise+Rally+-+Third+Edition&dates=20261025T110000Z/20261025T150000Z&details=Theme:+The+Cornerstone+(Ephesians+2:20)&location=Martyrs+Church+Nateete">
      📅 Add to Google Calendar
    </a>

    <div class="contact">
      📞 Inquiries: +256 784 474159 | +256 760 193020
    </div>
  </div>

</body>
</html>
